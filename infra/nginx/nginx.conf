# Nginx de TCGMASTER: punto de entrada único del sitio.
# - /media/   imágenes del catálogo (estáticas, caché larga en el navegador).
# - /api/     proxy a FastAPI con conexiones persistentes (keepalive).
# - /health   proxy a FastAPI (lo usan Docker y el balanceador del deploy).
# - /metrics  NO se publica: Prometheus lo consulta directo en api:8000.
# - /assets/  JS/CSS/fuentes del frontend (nombres con hash, caché de un año).
# - /         el frontend (React); rutas desconocidas -> index.html.
#
# El log de acceso es JSON e incluye request_time (total visto por Nginx) y
# upstream_response_time (solo la API): su diferencia aísla el costo de red/proxy.

worker_processes auto;
events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Reutiliza el X-Request-ID del cliente (k6) o genera uno; se propaga a la API.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json escape=json '{'
        '"ts":"$time_iso8601",'
        '"remote":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$req_id",'
        '"traffic_type":"$http_x_traffic_type",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml text/plain;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;

        location /media/ {
            alias /srv/media/;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Request-ID $req_id;
        }

        location = /metrics {
            return 404;
        }

        # Archivos del build con hash en el nombre: nunca cambian, caché de un año.
        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Aplicación de una sola página: cualquier ruta desconocida devuelve index.html
        # (React Router decide qué mostrar). index.html no se cachea para que un
        # deploy nuevo se vea de inmediato.
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
