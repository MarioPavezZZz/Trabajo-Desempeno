# TCGMASTER — entorno reproducible.
# Los límites de CPU/memoria vienen de variables de entorno (.env) para poder
# repetir las pruebas de carga con exactamente los mismos recursos.
#
# Uso (paso 2):
#   docker compose up -d db
#   docker compose run --rm api alembic upgrade head
#   docker compose run --rm api python scripts/seed_catalog.py all
#   docker compose run --rm api pytest

name: tcgmaster

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcgmaster}
      POSTGRES_USER: ${POSTGRES_USER:-tcgmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcgmaster}
    # pg_stat_statements y track_io_timing quedan activos para la Fase 2:
    # permiten ver qué consultas consumen más tiempo durante las pruebas.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: ${DB_MEMORY:-512m}

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tcgmaster-api:dev
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATA_DIR: /data
    volumes:
      # Caché de APIs e imágenes: persisten en el host y no se versionan.
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: ${API_MEMORY:-512m}

volumes:
  pgdata:
