# TCGMASTER — entorno reproducible.
# Los límites de CPU/memoria vienen de variables de entorno (.env) para poder
# repetir las pruebas de carga con exactamente los mismos recursos.
#
# Primera vez:
#   docker compose up -d db
#   docker compose run --rm api alembic upgrade head
#   docker compose run --rm api python scripts/seed_catalog.py all
# Levantar el sitio:
#   docker compose up -d            -> http://localhost:8080
# Tests:
#   docker compose run --rm api pytest

name: tcgmaster

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcgmaster}
      POSTGRES_USER: ${POSTGRES_USER:-tcgmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcgmaster}
    # pg_stat_statements y track_io_timing quedan activos para la Fase 2:
    # permiten ver qué consultas consumen más tiempo durante las pruebas.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo en la interfaz local: la base nunca queda expuesta a la red.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: ${DB_MEMORY:-512m}

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tcgmaster-api:dev
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATA_DIR: /data
      # Se puede cambiar al levantar sin editar .env:
      #   PAYMENT_PROVIDER=mock docker compose up -d api
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-webpay}
    volumes:
      # Caché de APIs e imágenes: persisten en el host y no se versionan.
      - ./data:/data
    ports:
      # Acceso directo a la API (incluido /metrics) solo desde esta máquina.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: ${API_MEMORY:-512m}

  web:
    # Nginx con el frontend compilado adentro (ver frontend/Dockerfile).
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_TRAFFIC_TYPE: ${VITE_TRAFFIC_TYPE:-real}
        VITE_TEST_HELPERS: ${VITE_TEST_HELPERS:-false}
        VITE_ANALYTICS_DEBUG: ${VITE_ANALYTICS_DEBUG:-false}
    image: tcgmaster-web:dev
    volumes:
      - ./data/media:/srv/media:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-0.5}"
          memory: ${WEB_MEMORY:-128m}

volumes:
  pgdata:
